# BeingBeyond D1 body model — served by the built-in Soma v2 system component.
# `rbnx boot` auto-injects this file as soma's robot_yaml because it sits next
# to robonix_manifest.yaml.
#
# What soma actually parses (system/soma/src/store.rs::MinimalSomaDoc):
#   - urdf.path          (resolved relative to this file; must exist)
#   - robot.id           (required, non-empty)
#   - robot.footprint    (optional; validated ≥3 pts, must enclose origin)
# Everything else (dimensions, mass_kg, tree, description) is served verbatim
# via robonix/system/soma/get_yaml and consumed by Pilot as LLM body context.
# Schema follows the syswonder robot-agilex-piper convention (tree / provided_by
# / manipulator / sensor{placement} / human_label) that Pilot's soma_context
# prompt expects.

urdf:
  # Relative to this file's directory. This deploy repo ships the D1 URDF under
  # urdf/, with meshes alongside under urdf/meshes/ (referenced relatively by
  # the URDF itself).
  path: ./urdf/robot_right_hand.urdf
  root_link: link_base
  model_name: beingbeyond_d1

robot:
  id: beingbeyond_d1
  display_name: "BeingBeyond D1 fixed-base 6-DOF arm with dexterous hand and head RGB-D camera"
  family: fixed_single_arm_desktop
  root_part: base
  # NOTE: dimensions/mass_kg are NOT parsed by soma — served raw as LLM context.
  dimensions: { length_m: 0.25, width_m: 0.30, height_m: 0.60 }
  mass_kg: 5.0
  footprint:
    base_frame: link_base
    # Small static base hull (0.20 m square, CCW) — D1 is a fixed-base arm with
    # no mobile chassis, so this is its mount footprint, not a drivable base.
    points:
      - [0.10, 0.10]
      - [0.10, -0.10]
      - [-0.10, -0.10]
      - [-0.10, 0.10]

# Semantic body tree (served raw for Pilot). link_base is the shared root; the
# arm and the head branch off it. Each part's `provided_by` lists the contracts
# that serve it and the provider_id (= the primitive package deployed in
# robonix_manifest.yaml's `primitive:` block: d1_arm / d1_hand / d1_camera).
tree:
  id: base
  part_type: fixed_base
  human_label: "固定底座（桌面安装，无移动/导航能力）"
  link: link_base
  provided_by: []
  children:
    - id: arm
      part_type: manipulator
      human_label: "6 自由度机械臂"
      link: link_base
      manipulator:
        dof: 6
        base_link: link_base
        end_effector_link: ee
        joints: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6]
        # TODO: measured reach / rated payload.
        reach_m: 0.60
        max_payload_kg: 1.0
      # Served by the d1_arm primitive (HeadArm SDK over serial). state is the
      # get_state rpc — the D1 deploy has no ROS backend, so no state_joint
      # topic_out. Head positioning is arm/set_head (declared under the head part,
      # since d1_arm owns the shared serial link).
      provided_by:
        - { contract: robonix/primitive/arm/info,       provider_id: d1_arm }
        - { contract: robonix/primitive/arm/move_joint,  provider_id: d1_arm }
        - { contract: robonix/primitive/arm/get_state,   provider_id: d1_arm }
        - { contract: robonix/primitive/arm/move_pose,   provider_id: d1_arm }
      children:
        - id: hand
          part_type: end_effector
          human_label: "五指灵巧手（Linker，CAN 总线）"
          link: hand_base_link
          end_effector:
            modality: dexterous_hand
            dof: 6
            fingers: [thumb, index, middle, ring, pinky]
            # TODO: rated grasp payload.
            max_payload_kg: 0.5
          # Served by the d1_hand primitive (DexHand SDK over CAN). state is the
          # get_state rpc (no ROS backend → no state_joint topic_out).
          provided_by:
            - { contract: robonix/primitive/hand/info,       provider_id: d1_hand }
            - { contract: robonix/primitive/hand/move_joint,  provider_id: d1_hand }
            - { contract: robonix/primitive/hand/get_state,   provider_id: d1_hand }
    - id: head
      part_type: pan_tilt
      human_label: "2 自由度头部云台（偏航 + 俯仰）"
      link: link_head_base
      dof: 2
      joints: [joint_7_head_yaw, joint_8_head_pitch]
      # Head pan/tilt shares the arm's serial link, so it is positioned via the
      # d1_arm primitive's set_head rpc (there is no standalone head primitive).
      provided_by:
        - { contract: robonix/primitive/arm/set_head,   provider_id: d1_arm }
      children:
        - id: head_camera
          part_type: sensor
          human_label: "头部 Intel RealSense D435i RGB-D 相机（俯视工作台）"
          link: camera
          sensor:
            modality: rgbd
            placement: head          # Pilot matches requested viewpoint against this.
            resolution: [1280, 720]
            framerate_hz: 30
            depth_range_m: [0.2, 3.0]
          # Served by the d1_camera primitive (RealSense SDK). snapshot is gRPC
          # (consumed by block_grasp); depth_snapshot is MCP. rgb/depth/intrinsics
          # topic_out streams are not served (no ROS backend on the D1 deploy).
          provided_by:
            - { contract: robonix/primitive/camera/snapshot,       provider_id: d1_camera }
            - { contract: robonix/primitive/camera/depth_snapshot, provider_id: d1_camera }

description:
  summary: "BeingBeyond D1 桌面机器人：固定底座 6 自由度机械臂 + 2 自由度头部云台 + 五指灵巧手 + 头部 RGB-D 相机。当前部署提供“垂直抓取物体”(vertical_grasp_object) 技能：用头部相机检测桌面物体（YOLO 检测积木，或视觉大模型按自然语言开放词汇检测任意物体），并按坐标抓取 / 放置物体（可选传入抓取角度与手爪开合大小）。"
  can_do:
    - "用头部相机 + 视觉大模型（VLM）按自然语言描述开放词汇检测任意桌面物体（颜色/形状/文字/相对位置），返回其 base 系位置与抓取角度（detect_objects）；这是首选检测工具，问“桌上有什么/看到什么”或按描述找物体（含积木）都用它，不局限于 YOLO 类别；无深度、抓取高度按桌面平面假定。"
    - "（兜底）用头部 RGB-D 相机 + YOLO-OBB 检测桌面积木，报告每个积木的 base 系位置（detect_cubes）；仅当 detect_objects 失败或未配置 VLM 时用作退路。"
    - "把机械臂移到指定位置抓起物体并夹住，可选指定抓取角度（手腕绕竖直方向旋转）与手爪开合大小（pick_cube）。"
    - "把夹住的物体移到指定位置放下，可选指定角度与开合大小（place_cube）。"
    - "把一个颜色的积木叠到另一个颜色的积木上（stack_cubes）；给两个颜色，一次调用完成检测+抓取+放置，用于“把红色积木叠到绿色积木上”这类堆叠指令。"
    - "把一个颜色的方块放进固定的盒子/盘子里（put_cube_in_container）；给一个颜色，一次调用完成检测+抓取+放置到固定容器位置，用于“把红色方块放到盒子里”这类指令。"
    - "放置并复位后用 VLM 复核物体是否被移动到了目标位置（verify_grasp，mode=place）；抓取与放置之间不做验证。失败可重新检测再执行整个抓放。"
    - "通过头部 RGB-D 相机俯视观察桌面。"
  cannot_do:
    - "移动底盘或导航——D1 是固定底座，没有轮子/底盘。"
    - "从头部相机以外的视角观察（无腕部相机、无其它视角传感器）。"
    - "抓取超出机械臂工作范围的物体。"
  notes:
    - "Soma v2 只把本文件和引用的 URDF 作为原始文本服务；primitive/skill 的启动由 robonix_manifest.yaml 驱动。"
    - "机体部件由 d1_arm / d1_hand / d1_camera 三个原语提供（见 manifest 的 primitive 列表与各部件 provided_by）；均为直连 SDK + gRPC，无 ROS 后端，故状态读取用 get_state rpc 而非 topic_out 流。"
    - "检测 / 抓取能力来自“垂直抓取物体”(vertical_grasp_object) 技能（运行时经 atlas 注册，提供 detect_objects / detect_cubes / pick_cube / place_cube / verify_grasp / stack_cubes / put_cube_in_container），它作为消费者调用上述原语,不在本文件的机体树中声明。detect_objects 与 verify_grasp 依赖外部 VLM 接口（部署经 VLM_BASE_URL/VLM_API_KEY/VLM_MODEL 环境变量或技能配置提供）；未配置时这两个工具不可用，其余工具不受影响。推荐闭环：detect_objects 拿坐标+角度 → pick_cube → place_cube（放完自动复位让开）→ verify_grasp(place) 复核一次，验证失败则重新检测再执行整个抓放；抓取与放置之间不验证。"
