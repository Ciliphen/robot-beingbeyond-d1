# BeingBeyond D1 body model — served by the built-in Soma v2 system component.
# `rbnx boot` auto-injects this file as soma's robot_yaml because it sits next
# to robonix_manifest.yaml.
#
# What soma actually parses (system/soma/src/store.rs::MinimalSomaDoc):
#   - urdf.path          (resolved relative to this file; must exist)
#   - robot.id           (required, non-empty)
#   - robot.footprint    (optional; validated ≥3 pts, must enclose origin)
# Everything else (dimensions, mass_kg, tree, description) is served verbatim
# via robonix/system/soma/get_yaml and consumed by Pilot as LLM body context.
# Schema follows the syswonder robot-agilex-piper convention (tree / provided_by
# / manipulator / sensor{placement} / human_label) that Pilot's soma_context
# prompt expects.

urdf:
  # Relative to this file's directory. This deploy repo ships the D1 URDF under
  # urdf/, with meshes alongside under urdf/meshes/ (referenced relatively by
  # the URDF itself).
  path: ./urdf/robot_right_hand.urdf
  root_link: link_base
  model_name: beingbeyond_d1

robot:
  id: beingbeyond_d1
  display_name: "BeingBeyond D1 fixed-base 6-DOF arm with dexterous hand and head RGB-D camera"
  family: fixed_single_arm_desktop
  root_part: base
  # NOTE: dimensions/mass_kg are NOT parsed by soma — served raw as LLM context.
  dimensions: { length_m: 0.25, width_m: 0.30, height_m: 0.60 }
  mass_kg: 5.0
  footprint:
    base_frame: link_base
    # Small static base hull (0.20 m square, CCW) — D1 is a fixed-base arm with
    # no mobile chassis, so this is its mount footprint, not a drivable base.
    points:
      - [0.10, 0.10]
      - [0.10, -0.10]
      - [-0.10, -0.10]
      - [-0.10, 0.10]

# Semantic body tree (served raw for Pilot). link_base is the shared root; the
# arm and the head branch off it. Each part's `provided_by` lists the contracts
# that serve it and the provider_id (= the primitive package deployed in
# robonix_manifest.yaml's `primitive:` block: d1_arm / d1_hand / d1_camera).
tree:
  id: base
  part_type: fixed_base
  human_label: "Fixed base (desk-mounted; no locomotion or navigation)"
  link: link_base
  provided_by: []
  children:
    - id: arm
      part_type: manipulator
      human_label: "6-DOF arm"
      link: link_base
      manipulator:
        dof: 6
        base_link: link_base
        end_effector_link: ee
        joints: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6]
        # TODO: measured reach / rated payload.
        reach_m: 0.60
        max_payload_kg: 1.0
      # Served by the d1_arm primitive (HeadArm SDK over serial). state is the
      # get_state rpc — the D1 deploy has no ROS backend, so no state_joint
      # topic_out. Head positioning is arm/set_head (declared under the head part,
      # since d1_arm owns the shared serial link).
      provided_by:
        - { contract: robonix/primitive/arm/info,       provider_id: d1_arm }
        - { contract: robonix/primitive/arm/move_joint,  provider_id: d1_arm }
        - { contract: robonix/primitive/arm/get_state,   provider_id: d1_arm }
        - { contract: robonix/primitive/arm/move_pose,   provider_id: d1_arm }
      children:
        - id: hand
          part_type: end_effector
          human_label: "Five-finger dexterous hand (Linker, CAN bus)"
          link: hand_base_link
          end_effector:
            modality: dexterous_hand
            dof: 6
            fingers: [thumb, index, middle, ring, pinky]
            # TODO: rated grasp payload.
            max_payload_kg: 0.5
          # Served by the d1_hand primitive (DexHand SDK over CAN). state is the
          # get_state rpc (no ROS backend → no state_joint topic_out).
          provided_by:
            - { contract: robonix/primitive/hand/info,       provider_id: d1_hand }
            - { contract: robonix/primitive/hand/move_joint,  provider_id: d1_hand }
            - { contract: robonix/primitive/hand/get_state,   provider_id: d1_hand }
    - id: head
      part_type: pan_tilt
      human_label: "2-DOF head pan/tilt (yaw + pitch)"
      link: link_head_base
      dof: 2
      joints: [joint_7_head_yaw, joint_8_head_pitch]
      # Head pan/tilt shares the arm's serial link, so it is positioned via the
      # d1_arm primitive's set_head rpc (there is no standalone head primitive).
      provided_by:
        - { contract: robonix/primitive/arm/set_head,   provider_id: d1_arm }
      children:
        - id: head_camera
          part_type: sensor
          human_label: "Head Intel RealSense D435i RGB-D camera (looks down at the workbench)"
          link: camera
          sensor:
            modality: rgbd
            placement: head          # Pilot matches requested viewpoint against this.
            resolution: [1280, 720]
            framerate_hz: 30
            depth_range_m: [0.2, 3.0]
          # Served by the d1_camera primitive (RealSense SDK). snapshot is gRPC
          # (consumed by block_grasp); depth_snapshot is MCP. rgb/depth/intrinsics
          # topic_out streams are not served (no ROS backend on the D1 deploy).
          provided_by:
            - { contract: robonix/primitive/camera/snapshot,       provider_id: d1_camera }
            - { contract: robonix/primitive/camera/depth_snapshot, provider_id: d1_camera }

description:
  summary: "BeingBeyond D1 desktop robot: a fixed-base 6-DOF arm + a 2-DOF head pan/tilt + a five-finger dexterous hand + a head RGB-D camera. This deployment provides the vertical_grasp_object skill: detect objects on the table with the head camera (YOLO for cubes, or a VLM for open-vocabulary detection of anything from a natural-language description) and pick / place them by coordinate, with an optional grasp angle and gripper aperture."
  can_do:
    - "Detect ANY object on the table from a natural-language description (colour / shape / text / relative position) using the head camera + a VLM, returning its base-frame position and grasp angle (detect_objects). This is the PREFERRED detection tool: use it both for 'what is on the table / what do you see' and for finding an object by description (cubes included) — it is not limited to the YOLO classes. It has no depth, so the grasp height is assumed to be the table plane."
    - "(fallback) Detect cubes on the table with the head RGB-D camera + YOLO-OBB, reporting each cube's base-frame position (detect_cubes). Use this only when detect_objects fails or no VLM is configured."
    - "Move the arm to a given position, grasp an object and keep holding it, with an optional grasp angle (wrist rotation about the vertical axis) and gripper aperture (pick_cube)."
    - "Move a held object to a given position and release it, with an optional angle and aperture (place_cube)."
    - "Stack a cube of one colour on top of a cube of another colour (stack_cubes). Give it two colours and one call does detect + pick + place — use it for stacking requests like 'stack the red cube on the green one'."
    - "Put a cube of a given colour into the fixed box / plate (put_cube_in_container). Give it one colour and one call does detect + pick + place at the fixed container spot — use it for requests like 'put the red cube in the box'."
    - "Sort every cube on the table into its colour's fixed spot (sort_cubes). One call detects them all and picks/places each in turn — use it for requests like 'sort the cubes by colour' or 'tidy up the cubes'."
    - "After placing and parking, re-check with the VLM whether the object actually ended up at the target position (verify_grasp, mode=place). Nothing is verified between the pick and the place. On failure, re-detect and redo the whole pick-and-place."
    - "Look down at the table through the head RGB-D camera."
    - "Make the dexterous hand 'dance': every finger wiggles open/closed rhythmically for a requested duration, then the hand returns to open (gesture_dance, from the hand_gesture skill). Hand only — it moves no arm and uses no camera."
  cannot_do:
    - "Drive a chassis or navigate — the D1 is fixed-base, with no wheels or chassis."
    - "Look from any viewpoint other than the head camera (there is no wrist camera and no other viewpoint sensor)."
    - "Grasp objects outside the arm's reach."
  notes:
    - "Soma v2 serves only this file and the URDF it references, as raw text. Starting the primitives and skills is driven by robonix_manifest.yaml."
    - "The body parts are served by three primitives — d1_arm / d1_hand / d1_camera (see the manifest's primitive list and each part's provided_by). All of them talk to the SDK directly over gRPC with no ROS backend, so state is read through the get_state rpc rather than a topic_out stream."
    - "Detection and manipulation come from the vertical_grasp_object skill (registered through atlas at runtime, serving detect_objects / detect_cubes / pick_cube / place_cube / verify_grasp / stack_cubes / put_cube_in_container / sort_cubes). It is a consumer of the primitives above and is not declared in this file's body tree. detect_objects and verify_grasp depend on an external VLM endpoint (supplied by the deployment through the VLM_BASE_URL / VLM_API_KEY / VLM_MODEL env vars or the skill config); without it those two tools are unavailable while the rest keep working. Recommended loop: detect_objects for the position and angle → pick_cube → place_cube (which parks out of the way afterwards) → verify_grasp(place) once. If verification fails, re-detect and redo the whole pick-and-place. Nothing is verified between the pick and the place."
