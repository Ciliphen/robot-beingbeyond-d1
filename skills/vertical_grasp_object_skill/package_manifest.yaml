manifestVersion: 1

package:
  name: com.beingbeyond.skill.vertical_grasp_object
  version: 0.1.0
  vendor: beingbeyond
  description: Detect objects on the table (YOLO cubes, or open-vocabulary via a VLM), then grasp and place them (with optional grasp angle and gripper aperture) — MCP tools for the D1 dexterous hand.
  tags: [skill, grasp, manipulation, beingbeyond-d1]
  maintainers:
    - Felix <xi.lifeng@qq.com>
  license: MulanPSL-2.0

build: bash scripts/build.sh
start: bash scripts/start.sh

# Package-local contracts: this skill owns its interface (it IS the new
# capability). The codegen step picks these up from ./capabilities and, with
# --mcp, emits the typed Request/Response classes used in main.py.
capabilities:
  - name: robonix/skill/vertical_grasp_object/driver
  - name: robonix/skill/vertical_grasp_object/pick_cube
  - name: robonix/skill/vertical_grasp_object/place_cube
  - name: robonix/skill/vertical_grasp_object/detect_cubes
  - name: robonix/skill/vertical_grasp_object/detect_objects
  - name: robonix/skill/vertical_grasp_object/verify_grasp
  - name: robonix/skill/vertical_grasp_object/stack_cubes

# Upstream hardware the skill consumes at runtime (discovered via atlas). The
# arm + hand primitives own the hardware; the skill drives them over gRPC and
# never opens the serial link / CAN bus itself. The camera primitive provides
# snapshots consumed by the YOLO/VLM detection stage.
depends:
  - name: robonix/primitive/arm/get_state
  - name: robonix/primitive/arm/move_joint
  - name: robonix/primitive/arm/set_head
  - name: robonix/primitive/hand/move_joint
  - name: robonix/primitive/hand/get_state
  - name: robonix/primitive/hand/info
  - name: robonix/primitive/camera/snapshot
