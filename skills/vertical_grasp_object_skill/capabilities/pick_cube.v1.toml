# MCP-callable "pick up an object at a location" tool. The LLM picks this up via
# pilot when the user says something like "把物体从这里抓起来" / "pick up the
# object at 0.2,0.1" — the handler docstring in main.py is what the LLM reads.
[contract]
id      = "robonix/skill/vertical_grasp_object/pick_cube"
version = "1"
kind    = "skill"
idl     = "vertical_grasp_object/srv/PickCube.srv"

[mode]
type = "rpc"
