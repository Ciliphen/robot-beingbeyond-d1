# MCP-callable "did the pick/place actually work?" tool. The LLM should call
# this right after every pick_cube / place_cube: it re-detects the object with
# the VLM and checks whether it is now present at the target position, so the
# pilot can tell success from a missed / slipped grasp and retry if needed.
[contract]
id      = "robonix/skill/vertical_grasp_object/verify_grasp"
version = "1"
kind    = "skill"
idl     = "vertical_grasp_object/srv/VerifyGrasp.srv"

[mode]
type = "rpc"
