# MCP-callable "stack one cube on another" tool. The LLM picks this up via pilot
# when the user wants to STACK cubes, e.g. "把红色积木叠到绿色积木上" / "stack the
# red cube on the yellow one" — PREFER this over calling detect_cubes + pick_cube
# + place_cube by hand: it does the whole detect -> pick -> place -> park in one
# call. The handler docstring in main.py is what the LLM reads.
[contract]
id      = "robonix/skill/vertical_grasp_object/stack_cubes"
version = "1"
kind    = "skill"
idl     = "vertical_grasp_object/srv/StackCubes.srv"

[mode]
type = "rpc"
