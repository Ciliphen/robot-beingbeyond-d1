# MCP-callable "put a coloured cube into the container" tool. The LLM picks this
# up via pilot when the user wants to put/drop a cube INTO a box / plate / bowl,
# e.g. "把红色方块放到盒子里" / "把蓝色积木放进盘子" — PREFER this over calling
# detect_cubes + pick_cube + place_cube by hand: it does the whole detect ->
# pick -> place -> park in one call, releasing at the fixed container position.
# The handler docstring in main.py is what the LLM reads.
[contract]
id      = "robonix/skill/vertical_grasp_object/put_cube_in_container"
version = "1"
kind    = "skill"
idl     = "vertical_grasp_object/srv/PutCubeInContainer.srv"

[mode]
type = "rpc"
