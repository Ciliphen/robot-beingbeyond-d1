manifestVersion: 1
name: robot-beingbeyond-d1

catalog:
  name: robonix.robot.beingbeyond.d1
  version: 0.1.0
  description: BeingBeyond D1 desktop robot deployment — dexterous-hand object pick/place skill.
  license: MulanPSL-2.0
  tags: [robot, deploy, beingbeyond, d1, manipulation, dexterous-hand]
  maintainers:
    - Felix <xi.lifeng@qq.com>

# ── Voice / speech env ───────────────────────────────────────────────
# custom ASR backend → external PaddleSpeech WebSocket. PADDLE_ASR_HOST left
# unset resolves to the WSL default gateway (= Windows host under NAT), so it
# survives WSL restarts changing the IP. Selecting `custom` also keeps
# `rbnx build` from pulling Torch/CUDA/FunASR/Whisper.
#
# TTS reuses the speech package's Tencent Cloud TextToVoice backend under the
# same `custom` umbrella, so ASR stays on Paddle while replies get spoken.
# TencentTTSBackend needs only SecretId/SecretKey (the ASR AppID is not used);
# export them in the operator shell before `rbnx boot` — see .env.example.
env:
  # Absolute path to THIS deploy repo. The packages are fetched by `url:` into
  # rbnx-boot/cache/, so robot-specific assets that live here (YOLO weights and
  # hand-eye calibration under ./models/) have to be handed to them as absolute
  # paths. Edit this line if you cloned the repo somewhere else — a value set
  # here WINS over one exported in your shell (rbnx overwrites the process env
  # from `env:`), so exporting D1_DEPLOY_DIR will not override it.
  # ${HOME} itself is expanded from the real process environment.
  D1_DEPLOY_DIR: ${HOME}/robot-beingbeyond-d1

  SPEECH_BACKEND: custom
  SPEECH_ASR_STREAM_BACKEND_CLASS: speech_service.paddle_asr:PaddleStreamingASRBackend
  SPEECH_ASR_BACKEND_CLASS: speech_service.paddle_asr:PaddleStreamingASRBackend
  SPEECH_TTS_BACKEND_CLASS: speech_service.tencent_cloud:TencentTTSBackend
  PADDLE_ASR_PORT: "8090"

# Robonix system services. atlas / executor / pilot / liaison ship with
# robonix-cli; rbnx boot spawns them before any user package. pilot needs a
# VLM upstream — fill the env vars in your shell (copy .env.example → .env).
system:
  atlas:    { listen: 127.0.0.1:50051, log: info }
  executor: { listen: 127.0.0.1:50061, log: info }
  soma:
    # D1 body model, shipped in this repo (urdf under ./urdf/).
    robot_yaml: ./soma.yaml
  pilot:
    listen: 127.0.0.1:50071
    log: info
    vlm:
      upstream:   ${VLM_BASE_URL}
      api_key:    ${VLM_API_KEY}
      model:      ${VLM_MODEL}
      api_format: openai
  liaison:  { listen: 127.0.0.1:50081, log: info }

# ── Hardware primitives ──────────────────────────────────────────────
# The vertical_grasp_object skill consumes d1_arm + d1_hand + d1_camera over gRPC.
# Each lives in its own community repo (fetched into rbnx-boot/cache/) and owns
# its hardware: the serial link / CAN bus / RealSense. arm+hand need only the
# beingbeyond_d1_sdk wheel + robonix_api; d1_camera needs pyrealsense2. The
# camera feeds the skill's detection stage — run it at the hand-eye calibration
# resolution (1280x720) so detections resolve correctly.
primitive:
  - name: d1_arm
    url: https://github.com/Ciliphen/primitive-beingbeyond-d1-arm-rbnx
    branch: main
    config:
      dev: /dev/ttyUSB0
      baudrate: 1000000
      ik_pos_tol: 0.05
  - name: d1_hand
    url: https://github.com/Ciliphen/primitive-beingbeyond-d1-hand-rbnx
    branch: main
    config:
      hand_type: right
      can_iface: can0
      baudrate: 1000000
  - name: d1_camera
    url: https://github.com/Ciliphen/primitive-beingbeyond-d1-camera-rbnx
    branch: main
    config:
      width: 1280
      height: 720
      fps: 30
      frame_id: camera
  # Audio capture for the voice pipeline. WSLg exposes the Windows mic as a
  # PulseAudio RDPSource; ~/.asoundrc bridges ALSA default → pulse so the
  # ALSA-based driver's `arecord`/`aplay` reach it. WSLg has no real sound
  # card, so `arecord -l` is empty — the device MUST be set explicitly to
  # `pulse` rather than left to auto-scan.
  - name: audio_driver
    url: https://github.com/syswonder/primitive-audio-driver-rbnx
    branch: main
    config:
      mic_device: pulse
      speaker_device: pulse

# speech — ASR via PaddleSpeech, TTS via Tencent Cloud. The custom ASR backend
# forwards 16k/mono/pcm_s16le to an external PaddleSpeech streaming service over
# WebSocket (see speech_service/paddle_asr.py); TTS returns 16 kHz mono
# pcm_s16le, which the audio_driver speaker primitive plays directly. Liaison's
# voice loop uses asr_stream + tts + speaker; the speech/speak MCP tool lets
# pilot announce arbitrary text on the same speaker.
service:
  - name: speech
    path: ${ROBONIX_SOURCE_PATH}/services/speech
    config:
      # 1001 = zhiyu (basic model). Verified end-to-end: "机械臂已就位" returns
      # 58240 PCM bytes ≈ 1.82 s at 16 kHz. The premium sibling 101001 returned
      # only 5888 bytes (≈0.18 s) for the same text — audio truncated despite an
      # HTTP success — so stay on the basic voice until that is understood.
      # ModelType/SampleRate/Codec keep the default 1 / 16000 / pcm, which
      # already matches what the speaker primitive expects.
      tencent_tts_voice_type: 1001
      tencent_tts_region: ap-guangzhou
      # Only one speaker provider exists in this deployment (audio_driver), so
      # speech/speak can resolve it without pilot passing an explicit target.
      default_speaker_provider_id: audio_driver

# ── Skills ───────────────────────────────────────────────────────────
# vertical_grasp_object: seven MCP tools (detect_cubes / detect_objects / pick_cube /
# place_cube / verify_grasp / stack_cubes / put_cube_in_container). pilot dispatches to
# it through executor when the user asks to find / pick up / put down an object
# (pick_cube / place_cube also take an optional grasp angle and gripper aperture), to
# STACK cubes (stack_cubes — give two colours, it detects+picks+places in one call), or
# to put a cube INTO a box/plate (put_cube_in_container — give one colour, it
# detects+picks+places at the fixed container spot in one call). detect_cubes (YOLO, fixed cube
# classes) needs the weights + hand-eye calibration under this repo's ./models/
# (see that dir's README; git-ignored, and NOT in the skill package since they
# are robot-specific and the package is fetched fresh into rbnx-boot/cache/).
# detect_objects (open-vocabulary via a VLM) shares that calibration and needs a
# VLM endpoint — configured below or via env VLM_BASE_URL/VLM_API_KEY/VLM_MODEL;
# left empty it is simply disabled while the other tools keep working.
skill:
  - name: vertical_grasp_object
    url: https://github.com/Ciliphen/skill-vertical-grasp-object-rbnx
    branch: main
    config:
      detect_debug: true
      pick_z: 0.025
      urdf_path: ""
      # Detection assets — robot-specific, so they live in THIS deploy repo, not
      # in the skill package. The skill is now fetched by `url:` into
      # rbnx-boot/cache/, whose models/ dir is empty, so these MUST be absolute
      # paths: the skill uses an absolute path as-is, while a relative one would
      # anchor on the cached package root and miss them.
      # D1_DEPLOY_DIR is exported in `env:` above — set it to this repo's path.
      # Provide both files under ./models/ — see ./models/README.md.
      model_path: ${D1_DEPLOY_DIR}/models/best.pt
      calib_path: ${D1_DEPLOY_DIR}/models/handeye_calib.npz
      # Constant correction (m) to the calibrated table plane Z (both detectors +
      # perspective correction). NEGATIVE if picks land a fixed amount too high
      # across the whole table (try -0.01, -0.02 ...); positive if too low.
      table_z_offset: 0
      # VLM endpoint for detect_objects. Empty → falls back to env
      # VLM_BASE_URL / VLM_API_KEY / VLM_MODEL (the deployment's VLM). Model must
      # accept image input. vlm_grasp_height (m) is the assumed grasp Z above the
      # table since the VLM gives no depth.
      vlm_base_url: ""
      vlm_api_key: ""
      vlm_model: ""
      vlm_grasp_height: 0.025
      # verify_grasp: a re-detected object within this radius (m) of the queried
      # position counts as "at" it (pick=now absent, place=now present).
      verify_match_radius: 0.05
      # stack_cubes: one cube height (m); the top cube is released at
      # base_cube_z + block_height so it lands one cube above the base.
      block_height: 0.05
      # pick(): judge grasp success from the hand's finger angles. Set false to
      # disable — pick() then assumes the grasp held once the hand closes. Use if
      # the finger-angle feedback misfires (reports "grasp failed" on a cube that
      # was actually held), which makes sort_cubes open the hand and drop it.
      grasp_feedback: false

  # hand_gesture: one MCP tool (gesture_dance). pilot dispatches to it through
  # executor when the user asks the hand to "dance" / wiggle its fingers. Hand-
  # only — consumes just d1_hand (hand/move_joint + hand/info) over gRPC; no
  # arm, camera, model, or calibration. No tunable config (the per-call
  # duration_s is the only knob).
  - name: hand_gesture
    url: https://github.com/Ciliphen/skill-hand-gesture-rbnx
    branch: main
    config: {}
