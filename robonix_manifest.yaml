manifestVersion: 1
name: robot-beingbeyond-d1

catalog:
  name: robonix.robot.beingbeyond.d1
  version: 0.1.0
  description: BeingBeyond D1 desktop robot deployment — dexterous-hand cube pick/place skill.
  license: MulanPSL-2.0
  tags: [robot, deploy, beingbeyond-d1, manipulation]
  maintainers:
    - Felix <xi.lifeng@qq.com>

# Robonix system services. atlas / executor / pilot / liaison ship with
# robonix-cli; rbnx boot spawns them before any user package. pilot needs a
# VLM upstream — fill the env vars in your shell (copy .env.example → .env).
system:
  atlas:    { listen: 127.0.0.1:50051, log: info }
  executor: { listen: 127.0.0.1:50061, log: info }
  soma:
    # D1 body model, shipped in this repo (urdf under ./urdf/).
    robot_yaml: ./soma.yaml
  pilot:
    listen: 127.0.0.1:50071
    log: info
    vlm:
      upstream:   ${VLM_BASE_URL}
      api_key:    ${VLM_API_KEY}
      model:      ${VLM_MODEL}
      api_format: openai
  liaison:  { listen: 127.0.0.1:50081, log: info }

# ── Hardware primitives ──────────────────────────────────────────────
# The grasp_cube skill consumes d1_arm + d1_hand over gRPC. Both are shipped in
# this repo under ./primitives/ (they own the serial link / CAN bus and depend
# only on the beingbeyond_d1_sdk wheel + robonix_api, not on any repo source).
# No camera primitive: this skill needs no vision.
primitive:
  - name: d1_arm
    path: ./primitives/d1_arm
    config:
      dev: /dev/ttyUSB0
      baudrate: 1000000
      ik_pos_tol: 0.05
  - name: d1_hand
    path: ./primitives/d1_hand
    config:
      hand_type: right
      can_iface: can0
      baudrate: 1000000

service: []

# ── Skills ───────────────────────────────────────────────────────────
# grasp_cube: two MCP tools (pick_cube / place_cube). pilot dispatches to it
# through executor when the user asks to pick up / put down a cube.
skill:
  - name: grasp_cube
    path: ./skills/grasp_cube_skill
    config:
      pick_z: 0.095
      urdf_path: ""
