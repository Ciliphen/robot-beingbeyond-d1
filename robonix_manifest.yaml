manifestVersion: 1
name: robot-beingbeyond-d1

catalog:
  name: robonix.robot.beingbeyond.d1
  version: 0.1.0
  description: BeingBeyond D1 desktop robot deployment — dexterous-hand object pick/place skill.
  license: MulanPSL-2.0
  tags: [robot, deploy, beingbeyond-d1, manipulation]
  maintainers:
    - Felix <xi.lifeng@qq.com>

# ── Voice / speech env ───────────────────────────────────────────────
# custom ASR backend → external PaddleSpeech WebSocket. PADDLE_ASR_HOST left
# unset resolves to the WSL default gateway (= Windows host under NAT), so it
# survives WSL restarts changing the IP. Selecting `custom` also keeps
# `rbnx build` from pulling Torch/CUDA/FunASR/Whisper.
env:
  SPEECH_BACKEND: custom
  SPEECH_ASR_STREAM_BACKEND_CLASS: speech_service.paddle_asr:PaddleStreamingASRBackend
  SPEECH_ASR_BACKEND_CLASS: speech_service.paddle_asr:PaddleStreamingASRBackend
  PADDLE_ASR_PORT: "8090"

# Robonix system services. atlas / executor / pilot / liaison ship with
# robonix-cli; rbnx boot spawns them before any user package. pilot needs a
# VLM upstream — fill the env vars in your shell (copy .env.example → .env).
system:
  atlas:    { listen: 127.0.0.1:50051, log: info }
  executor: { listen: 127.0.0.1:50061, log: info }
  soma:
    # D1 body model, shipped in this repo (urdf under ./urdf/).
    robot_yaml: ./soma.yaml
  pilot:
    listen: 127.0.0.1:50071
    log: info
    vlm:
      upstream:   ${VLM_BASE_URL}
      api_key:    ${VLM_API_KEY}
      model:      ${VLM_MODEL}
      api_format: openai
  liaison:  { listen: 127.0.0.1:50081, log: info }

# ── Hardware primitives ──────────────────────────────────────────────
# The vertical_grasp_object skill consumes d1_arm + d1_hand + d1_camera over gRPC, all
# shipped in this repo under ./primitives/ (they own the serial link / CAN bus /
# RealSense; arm+hand depend only on the beingbeyond_d1_sdk wheel + robonix_api,
# d1_camera vendors vision.RealSenseCamera into its package at build time). The camera
# feeds the skill's detect_cubes (YOLO) tool; run it at the hand-eye calibration
# resolution (1280x720) so detections resolve correctly.
primitive:
  - name: d1_arm
    path: ./primitives/d1_arm
    config:
      dev: /dev/ttyUSB0
      baudrate: 1000000
      ik_pos_tol: 0.05
  - name: d1_hand
    path: ./primitives/d1_hand
    config:
      hand_type: right
      can_iface: can0
      baudrate: 1000000
  - name: d1_camera
    path: ./primitives/d1_camera
    config:
      width: 1280
      height: 720
      fps: 30
      frame_id: camera
  # Audio capture for the voice pipeline. WSLg exposes the Windows mic as a
  # PulseAudio RDPSource; ~/.asoundrc bridges ALSA default → pulse so the
  # ALSA-based driver's `arecord`/`aplay` reach it. WSLg has no real sound
  # card, so `arecord -l` is empty — the device MUST be set explicitly to
  # `pulse` rather than left to auto-scan.
  - name: audio_driver
    url: https://github.com/syswonder/primitive-audio-driver-rbnx
    branch: main
    config:
      mic_device: pulse
      speaker_device: pulse

# speech — ASR only (no TTS). Custom backend forwards 16k/mono/pcm_s16le to an
# external PaddleSpeech streaming ASR service over WebSocket (see
# speech_service/paddle_asr.py). Liaison's voice loop connects to asr_stream;
# TTS is intentionally absent, so voice replies fall back to text PILOT events.
service:
  - name: speech
    path: ${ROBONIX_SOURCE_PATH}/services/speech
    config: {}

# ── Skills ───────────────────────────────────────────────────────────
# vertical_grasp_object: seven MCP tools (detect_cubes / detect_objects / pick_cube /
# place_cube / verify_grasp / stack_cubes / put_cube_in_container). pilot dispatches to
# it through executor when the user asks to find / pick up / put down an object
# (pick_cube / place_cube also take an optional grasp angle and gripper aperture), to
# STACK cubes (stack_cubes — give two colours, it detects+picks+places in one call), or
# to put a cube INTO a box/plate (put_cube_in_container — give one colour, it
# detects+picks+places at the fixed container spot in one call). detect_cubes (YOLO, fixed cube
# classes) needs the weights + hand-eye calibration under
# ./skills/vertical_grasp_object_skill/models/ (see that dir's README; git-ignored).
# detect_objects (open-vocabulary via a VLM) shares that calibration and needs a
# VLM endpoint — configured below or via env VLM_BASE_URL/VLM_API_KEY/VLM_MODEL;
# left empty it is simply disabled while the other tools keep working.
skill:
  - name: vertical_grasp_object
    path: ./skills/vertical_grasp_object_skill
    config:
      detect_debug: true
      pick_z: 0.025
      urdf_path: ""
      # Detection assets. Empty → package defaults ./models/best.pt and
      # ./models/handeye_calib.npz (relative paths resolve to the skill package).
      model_path: ""
      calib_path: ""
      # Constant correction (m) to the calibrated table plane Z (both detectors +
      # perspective correction). NEGATIVE if picks land a fixed amount too high
      # across the whole table (try -0.01, -0.02 ...); positive if too low.
      table_z_offset: 0
      # VLM endpoint for detect_objects. Empty → falls back to env
      # VLM_BASE_URL / VLM_API_KEY / VLM_MODEL (the deployment's VLM). Model must
      # accept image input. vlm_grasp_height (m) is the assumed grasp Z above the
      # table since the VLM gives no depth.
      vlm_base_url: ""
      vlm_api_key: ""
      vlm_model: ""
      vlm_grasp_height: 0.025
      # verify_grasp: a re-detected object within this radius (m) of the queried
      # position counts as "at" it (pick=now absent, place=now present).
      verify_match_radius: 0.05
      # stack_cubes: one cube height (m); the top cube is released at
      # base_cube_z + block_height so it lands one cube above the base.
      block_height: 0.05

  # hand_gesture: one MCP tool (gesture_dance). pilot dispatches to it through
  # executor when the user asks the hand to "dance" / wiggle its fingers. Hand-
  # only — consumes just d1_hand (hand/move_joint + hand/info) over gRPC; no
  # arm, camera, model, or calibration. No tunable config (the per-call
  # duration_s is the only knob).
  - name: hand_gesture
    path: ./skills/hand_gesture_skill
    config: {}
