manifestVersion: 1
name: robot-beingbeyond-d1

catalog:
  name: robonix.robot.beingbeyond.d1
  version: 0.1.0
  description: BeingBeyond D1 desktop robot deployment — dexterous-hand object pick/place skill.
  license: MulanPSL-2.0
  tags: [robot, deploy, beingbeyond-d1, manipulation]
  maintainers:
    - Felix <xi.lifeng@qq.com>

# Robonix system services. atlas / executor / pilot / liaison ship with
# robonix-cli; rbnx boot spawns them before any user package. pilot needs a
# VLM upstream — fill the env vars in your shell (copy .env.example → .env).
system:
  atlas:    { listen: 127.0.0.1:50051, log: info }
  executor: { listen: 127.0.0.1:50061, log: info }
  soma:
    # D1 body model, shipped in this repo (urdf under ./urdf/).
    robot_yaml: ./soma.yaml
  pilot:
    listen: 127.0.0.1:50071
    log: info
    vlm:
      upstream:   ${VLM_BASE_URL}
      api_key:    ${VLM_API_KEY}
      model:      ${VLM_MODEL}
      api_format: openai
  liaison:  { listen: 127.0.0.1:50081, log: info }

# ── Hardware primitives ──────────────────────────────────────────────
# The vertical_grasp_object skill consumes d1_arm + d1_hand + d1_camera over gRPC, all
# shipped in this repo under ./primitives/ (they own the serial link / CAN bus /
# RealSense; arm+hand depend only on the beingbeyond_d1_sdk wheel + robonix_api,
# d1_camera also uses vision.RealSenseCamera from BEINGBEYOND_PATH). The camera
# feeds the skill's detect_cubes (YOLO) tool; run it at the hand-eye calibration
# resolution (1280x720) so detections resolve correctly.
primitive:
  - name: d1_arm
    path: ./primitives/d1_arm
    config:
      dev: /dev/ttyUSB0
      baudrate: 1000000
      ik_pos_tol: 0.05
  - name: d1_hand
    path: ./primitives/d1_hand
    config:
      hand_type: right
      can_iface: can0
      baudrate: 1000000
  - name: d1_camera
    path: ./primitives/d1_camera
    config:
      width: 1280
      height: 720
      fps: 30
      frame_id: camera

service: []

# ── Skills ───────────────────────────────────────────────────────────
# vertical_grasp_object: four MCP tools (detect_cubes / detect_objects / pick_cube /
# place_cube). pilot dispatches to it through executor when the user asks to
# find / pick up / put down an object (pick_cube / place_cube also take an
# optional grasp angle and gripper aperture). detect_cubes (YOLO, fixed cube
# classes) needs the weights + hand-eye calibration under
# ./skills/vertical_grasp_object_skill/models/ (see that dir's README; git-ignored).
# detect_objects (open-vocabulary via a VLM) shares that calibration and needs a
# VLM endpoint — configured below or via env VLM_BASE_URL/VLM_API_KEY/VLM_MODEL;
# left empty it is simply disabled while the other tools keep working.
skill:
  - name: vertical_grasp_object
    path: ./skills/vertical_grasp_object_skill
    config:
      pick_z: 0.095
      urdf_path: ""
      # Detection assets. Empty → package defaults ./models/best.pt and
      # ./models/handeye_calib.npz (relative paths resolve to the skill package).
      model_path: ""
      calib_path: ""
      # VLM endpoint for detect_objects. Empty → falls back to env
      # VLM_BASE_URL / VLM_API_KEY / VLM_MODEL (the deployment's VLM). Model must
      # accept image input. vlm_grasp_height (m) is the assumed grasp Z above the
      # table since the VLM gives no depth.
      vlm_base_url: ""
      vlm_api_key: ""
      vlm_model: ""
      vlm_grasp_height: 0.025
